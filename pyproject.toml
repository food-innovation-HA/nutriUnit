[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriunit"
version = "0.1.0"
description = "A lightweight nutrient unit conversion toolkit."
authors = [
    { name = "Graham McAuliffe" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas"
]

[project.optional-dependencies]
dev = ["pytest"]
